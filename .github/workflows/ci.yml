# CI — agibridge merge gate.
#
# DoD #1 (brief-devops-automator.md): lint (ruff check) + test (pytest) + F-1
# banned-word grep (BOTH scripts per the W2 propagation note in the dispatch
# brief — see comment on the "f1-banned-words" job below) + uv lock --locked.
#
# Scope IN per Phase D A3.3: Python 3.12 only (matches Dockerfile per spec §9.1).
# Scope OUT: no Dependabot (anti-pattern in brief), no APM, no analytics.
#
# Source-grounded:
#   - actions/checkout@v4 — official, pinned by major.
#       https://github.com/actions/checkout
#   - astral-sh/setup-uv@v3 — official Astral action; sets up `uv` and caches.
#       https://github.com/astral-sh/setup-uv
#   - GitHub Actions runner image: ubuntu-latest. Per the runner-images repo,
#     ubuntu-latest currently maps to ubuntu-24.04 LTS (predictable Docker engine
#     and curl already present).
#       https://github.com/actions/runner-images#available-images

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger from the Actions tab — useful for forcing a re-run
  # against a branch before merge to verify the gates.
  workflow_dispatch:

# Cancel in-progress runs on the same ref when a new commit is pushed (avoids
# wasted minutes on the free tier).
# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff check (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.30"
          enable-cache: true

      - name: Sync dev deps
        run: uv sync --frozen --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.30"
          enable-cache: true

      - name: Install system deps for python-magic
        # libmagic is the C library python-magic binds to; same package used in
        # the runtime Dockerfile (spec §7 "MIME spoofing" mitigation).
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libmagic1 ffmpeg

      - name: Sync deps (incl. dev)
        run: uv sync --frozen --extra dev

      - name: Run pytest
        run: uv run pytest -q

  uv-lock-check:
    name: uv lock --locked (lockfile freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.30"
      # `uv lock --locked` exits non-zero if pyproject.toml has been edited
      # without re-locking. This is the spec §9.1 HP-7 enforcement.
      - run: uv lock --locked

  f1-banned-words:
    name: F-1 banned-word grep (BOTH scripts — see W2 note)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        # Lighter than the full uv setup; the .py grep is stdlib-only.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The dispatch brief's "Cross-agent observation" section flagged that
      # backend-dev and tech-writer each shipped a banned-word checker that
      # covers PARTIAL surfaces (one Python — README + app/static + routes +
      # openapi + main.py; one Bash — landing/ + QUICKSTART + hf-space/).
      # Both source `scripts/f1-banned-words.regex` (C4 single source of
      # truth). We invoke BOTH in the same step until W2 unifies them; the
      # union is the actual coverage the spec §10 audit demands.
      #
      # If either script exits non-zero, the step fails and the merge gate
      # closes. TODO(W2): unify into a single Python entrypoint that walks
      # both target sets, then delete the .sh wrapper.
      - name: Run Python checker (README + app/static + routes + openapi + main.py)
        run: python scripts/check_f1_banned_words.py

      - name: Run Bash checker (README + QUICKSTART + landing/ + hf-space/)
        # The .sh script defaults REGEX_PATH to `../scripts/f1-banned-words.regex`
        # (relative to its own location); when invoked from repo root we point
        # it at the in-repo canonical copy explicitly.
        env:
          REGEX_PATH: scripts/f1-banned-words.regex
        run: bash scripts/check_f1_banned_words.sh

  docker-build:
    # DoD #5: `docker build -t agibridge .` succeeds AND `docker run` boots and
    # /api/v1/health returns 200 within 5s. We can't run docker locally on
    # macOS without Docker Desktop, so CI is the source of truth here. The
    # build also produces the BUILD_TIMES measurement used to replace the
    # spec's [ESTIMATE] markers.
    name: docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Buildx for cache support; default Docker engine on ubuntu-latest is
      # already present per actions/runner-images.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (timed)
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker build -t agibridge:ci .
          end=$(date +%s)
          echo "BUILD_SECONDS=$((end - start))" >> "$GITHUB_ENV"
          echo "Cold build took $((end - start))s"

      - name: Boot container + curl /api/v1/health (5 s SLA per DoD #5)
        run: |
          set -euo pipefail
          docker run -d --name agibridge_ci -p 7860:7860 agibridge:ci
          # Poll for up to 10 s; DoD says 5 s post-start. The HEALTHCHECK
          # start-period is 10 s in the Dockerfile to absorb cold-import time.
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:7860/api/v1/health >/tmp/health.json 2>/dev/null; then
              echo "Health OK after ${i}s"
              cat /tmp/health.json
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7860/api/v1/health
          docker logs agibridge_ci | tail -50
          docker stop agibridge_ci
          docker rm agibridge_ci

      - name: Capture build time as artifact
        # The build-time number replaces the spec's [ESTIMATE] markers in
        # BUILD_TIMES.md. Allen runs `gh run download` to grab it after a CI
        # run on main; first successful run committed manually.
        run: |
          mkdir -p _build_times
          {
            echo "## Run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "- commit: ${GITHUB_SHA}"
            echo "- runner: ubuntu-latest (\$(uname -r))"
            echo "- cold build: ${BUILD_SECONDS}s"
          } > _build_times/run.md
      - uses: actions/upload-artifact@v4
        with:
          name: build-time-${{ github.sha }}
          path: _build_times/run.md
          retention-days: 30
