[project]
name = "agibridge"
version = "0.0.1"
description = "Convert AgiBot World <-> LeRobot v3 datasets in your browser. Ephemeral, no accounts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Allen Wu", email = "allenwu@umich.edu" }]
# Top-level pins per spec v2.2 §9.1. Hard pin embodied-data (DR-3a=B locked).
dependencies = [
    "embodied-data==0.3.1",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "python-multipart>=0.0.9",
    "python-magic>=0.4.27",
    "python-ulid>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "freezegun>=1.5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app/api"]
omit = ["app/main.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests
