# Pre-commit hooks for agibridge.
# F-1 banned-word check sources `scripts/f1-banned-words.regex` (C4).
repos:
  - repo: local
    hooks:
      - id: f1-banned-words
        name: F-1 banned-word check
        entry: python scripts/check_f1_banned_words.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff lint
        entry: ruff check
        language: system
        types: [python]
        pass_filenames: true
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]
        pass_filenames: true
